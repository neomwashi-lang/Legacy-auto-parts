    ];

    const search = document.querySelector('#search');
    const results = document.querySelector('#results');
    const count = document.querySelector('#count');
    const clear = document.querySelector('#clear');

    function getCodeType(entry) {
      if (entry.term.startsWith('const ')) return 'Named constant';
      if (entry.term.startsWith('export function ') || entry.term.startsWith('function ')) return 'Named function';
      if (entry.term.startsWith('use') && !entry.term.includes('/')) return 'React hook';
      if (entry.term.includes('onClick') || entry.term.includes('onChange') || entry.term.includes('onSubmit')) return 'Event handler';
      if (entry.term.includes('ProductList') || entry.term.includes('ProductPage') || entry.term.includes('LandingPage') || entry.term.includes('AdminSidebar') || entry.term.includes('AdminLogin') || entry.term.includes('App /')) return 'React component';
      if (entry.term.includes('fetch') || entry.tool.includes('Fetch API')) return 'API logic';
      return 'JavaScript code';
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const matches = entries.filter((entry) => `${entry.term} ${entry.file} ${entry.language} ${entry.tool} ${entry.code || ''} ${entry.explanation}`.toLowerCase().includes(query));
      count.textContent = `${matches.length} explanation${matches.length === 1 ? '' : 's'} found`;
      const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
      results.innerHTML = matches.length ? matches.map((entry) => `
        <article>
          <h2>${entry.term}</h2>
          <p><span class="tag">File</span>${entry.file}</p>
          <p><span class="tag">Code type</span>${getCodeType(entry)}</p>
          <p><span class="tag">Language</span>${entry.language}</p>
          <p><span class="tag">Technology</span>${entry.tool}</p>
          ${entry.code ? `<pre>${escapeHtml(entry.code)}</pre>` : ''}
          <p><strong>Meaning:</strong> ${entry.explanation}</p>
        </article>
      `).join('') : '<article class="empty">No explanation found. Try a function name, file name, hook, route, or technology such as React, JSX, useState, fetch, or Tailwind.</article>';
    }

    search.addEventListener('input', render);
    clear.addEventListener('click', () => { search.value = ''; search.focus(); render(); });
    render();
  </script>
